<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Navigation Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#">BrightDesk</a>

    <nav class="main-nav" aria-label="Main">
      <ul class="nav-links">
        <li><a href="#" aria-current="page">Home</a></li>
        <li><a href="#">Features</a></li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <a class="nav-button" href="#">Sign up</a>
  </header>

  <main class="content">
    <h1>Resize the window</h1>
    <p>Drag the browser edge (or use DevTools device mode) and watch the navigation bar adapt. Above 700px the logo, links and button sit in one row. Below 700px they stack and center.</p>
  </main>
</body>
</html>
